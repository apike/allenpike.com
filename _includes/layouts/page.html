---
layout: default
---
<h1>{{ title }}</h1>

{% assign lastmod = updated | date: "%Y-%m-%d" %}
{% if lastmod != blank %}
<p class="meta">Last updated <time datetime="{{ lastmod }}">{{ lastmod | date: "%b %-d, %Y" }}</time></p>
{% endif %}

{% if warning %}
<p class='warning'>{{ warning }}</p>
{% endif %}

<div class="post">
{{ content }}
</div>
